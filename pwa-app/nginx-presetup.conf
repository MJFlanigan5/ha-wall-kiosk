# Loaded only when .htpasswd doesn't exist yet (see entrypoint.sh) — no
# Basic Auth anywhere, since there's no credential yet to check against.
# Every path except /healthz sends you to /setup; setup-server.py swaps
# this out for nginx-postsetup.conf and reloads nginx the moment a real
# login gets created, so this state never lingers past first setup.
server {
    listen 80;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Catch-all, not a redirect — a 302 to a root-relative /setup dropped
    # the port from its Location header when hit through a non-standard
    # port (18090 in local testing), sending the browser to the wrong
    # place entirely. Serving the content directly here sidesteps that.
    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
