# Agent listener (port 8082 in the container, published as 8091). Only
# loaded when FOYER_AGENT_TOKEN is set (entrypoint.sh renders __TOKEN__ at
# boot). Serves the same static app as the main listener but gates on a
# header instead of the login cookie, for headless/automation clients like
# foyer-mcp-server. The main listener, /login and setup-server.py are not
# touched by this. LAN only: do not point a tunnel at this port.
map $http_x_foyer_agent_token $foyer_agent_ok {
    default 0;
    "__TOKEN__" 1;
}

server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    if ($foyer_agent_ok = 0) {
        return 401;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
