services:
  ha-wall-kiosk-pwa:
    build: .
    container_name: ha-wall-kiosk-pwa
    restart: unless-stopped
    ports:
      - "8090:80"
      # Header-token listener for automation (foyer-mcp-server). LAN only.
      - "8091:8082"
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS}
      FOYER_AGENT_TOKEN: ${FOYER_AGENT_TOKEN:-}
    volumes:
      # Without this, the login only ever lived in the container's own
      # writable layer — every redeploy (docker compose up --build,
      # down+up, etc.) silently wiped it and reopened the wide-open
      # pre-setup state. Confirmed live: recreated the container after
      # completing setup and it reverted to showing the setup form again.
      - foyer-auth:/etc/nginx/auth

  # Foyer MCP server: headless Chromium driving the app through the agent
  # listener, served as MCP over HTTP on :8092 behind FOYER_MCP_TOKEN. LAN only.
  foyer-mcp:
    build: ../foyer-mcp
    container_name: foyer-mcp
    restart: unless-stopped
    depends_on:
      - ha-wall-kiosk-pwa
    ports:
      - "8092:8092"
    environment:
      FOYER_URL: http://ha-wall-kiosk-pwa:8082
      FOYER_TOKEN: ${FOYER_AGENT_TOKEN}
      FOYER_HA_URL: ws://192.168.2.87:8123/api/websocket
      FOYER_HA_TOKEN: ${FOYER_HA_TOKEN}
      FOYER_MCP_TOKEN: ${FOYER_MCP_TOKEN}
      FOYER_HOMEY_URL: ${FOYER_HOMEY_URL:-}
      FOYER_HOMEY_TOKEN: ${FOYER_HOMEY_TOKEN:-}
    shm_size: 256m
    mem_limit: 900m

volumes:
  foyer-auth:
