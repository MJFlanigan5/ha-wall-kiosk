# Rate-limits login attempts specifically (not every request the way
# Basic Auth's per-request check did) — /login and /auth-check are the
# only paths that ever check a credential now. burst=15 on /login covers
# a few real mistyped-password retries; sustained hammering past that
# drops to 10/min, turning a brute-force attempt against the shared
# password into an impractically slow one. /auth-check itself isn't
# rate-limited — it's an internal cookie check, not a credential guess,
# and every real page load fires one.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Without this, nginx's `return 302 /login;` below gets rewritten into
    # an absolute URL (scheme + host, no port) — nginx only knows it's
    # listening on plain-HTTP port 80 internally, with no idea Docker
    # republishes that as :8090 or that Cloudflare Tunnel terminates TLS
    # in front of it, so the generated Location silently drops the real
    # port and downgrades https to http. Confirmed live via curl -v: an
    # absolute redirect landed on port 80 instead of the actual published
    # port. A bare relative Location (just the path) lets the browser
    # resolve it against whatever origin/port it's actually using, which
    # is what every redirect here should do regardless of how this
    # container is fronted.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Real gate needed here because this is exposed via a Cloudflare
    # Tunnel with no Access policy in front of it — nginx is the actual
    # login, not just a convenience. Session-cookie based (2026-08-13),
    # not Basic Auth: auth_request asks setup-server.py's /auth-check
    # whether this request's cookie is a valid, unexpired session: a 401
    # there sends the browser to a real in-page /login instead of a
    # native browser credential popup (which can't be styled and has no
    # logout). Applies to every location by default — the handful that
    # must stay reachable pre-login (login itself, setup, health check)
    # explicitly turn it back off below.
    auth_request /auth-check;
    error_page 401 = @login_redirect;

    location @login_redirect {
        return 302 /login;
    }

    location = /auth-check {
        internal;
        proxy_pass http://127.0.0.1:8081/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Unauthenticated on purpose — Docker's HEALTHCHECK hits this, and it
    # must not require credentials to answer.
    location = /healthz {
        auth_request off;
        default_type text/plain;
        return 200 "ok";
    }

    # This config is only ever loaded once .htpasswd already exists (see
    # entrypoint.sh/setup-server.py), so /setup just shows "already
    # configured" here — kept reachable (not auth-gated) so that page
    # renders instead of a redirect loop, and rate-limited the same as
    # login out of caution.
    location /setup {
        auth_request off;
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }

    # Must stay reachable without a valid session — it's how you get one.
    location /login {
        auth_request off;
        limit_req zone=login burst=15 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }

    # No auth_request needed — clearing a cookie doesn't require proving
    # you still hold a valid one, and gating it would strand an expired
    # session behind the very login wall it's trying to leave.
    location /logout {
        auth_request off;
        proxy_pass http://127.0.0.1:8081;
    }

    # sw.js controls when the app updates itself — it must never be cached
    # by the browser or a proxy in front of this container, or new
    # deploys silently stop reaching devices (see sw.js's own comment on
    # the cache-first bug this already caused once).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
