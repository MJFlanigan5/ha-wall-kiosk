# Basic Auth has no login endpoint of its own to protect — every request
# gets checked — so this throttles all traffic per-IP rather than a single
# "login" path. burst=15 covers one full page load (index.html + all its
# JS/config/icons) without throttling real use; sustained hammering past
# that drops to 10/min, turning a brute-force attempt against the shared
# password into an impractically slow one.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    limit_req zone=login burst=15 nodelay;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Unauthenticated on purpose — Docker's HEALTHCHECK hits this, and it
    # must not require credentials to answer.
    location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok";
    }

    # This config is only ever loaded once .htpasswd already exists (see
    # entrypoint.sh/setup-server.py), so /setup just shows "already
    # configured" here — kept reachable (not auth-gated) so that page
    # renders instead of a raw 401, and rate-limited the same as
    # everything else out of caution.
    location /setup {
        auth_basic off;
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }

    # Gate everything else with Basic Auth. Real gate needed here because
    # this is exposed via a Cloudflare Tunnel with no Access policy in
    # front of it — nginx is the actual login, not just a convenience.
    auth_basic "Foyer";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # sw.js controls when the app updates itself — it must never be cached
    # by the browser or a proxy in front of this container, or new
    # deploys silently stop reaching devices (see sw.js's own comment on
    # the cache-first bug this already caused once).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
