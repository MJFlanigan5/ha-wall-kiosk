server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Unauthenticated on purpose — Docker's HEALTHCHECK hits this, and it
    # must not require credentials to answer.
    location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok";
    }

    # Gate everything else with Basic Auth. Real gate needed here because
    # this is exposed via a Cloudflare Tunnel with no Access policy in
    # front of it — nginx is the actual login, not just a convenience.
    auth_basic "HA Wall Kiosk";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # sw.js controls when the app updates itself — it must never be cached
    # by the browser or a proxy in front of this container, or new
    # deploys silently stop reaching devices (see sw.js's own comment on
    # the cache-first bug this already caused once).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
