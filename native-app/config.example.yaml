# Copy this file to config.yaml and fill in your own values.
# config.yaml is gitignored -- never commit real credentials.

home_assistant:
  # ws:// for plain HTTP instances, wss:// if yours is behind TLS
  url: "ws://homeassistant.local:8123/api/websocket"

  # Create one at: Home Assistant -> your profile -> Security tab ->
  # "Long-lived access tokens" -> Create Token. Paste it here, or leave
  # this blank and set the HA_TOKEN environment variable instead (the
  # env var takes precedence if both are set).
  token: ""

display:
  # Which areas to show on the Overview screen, in order. Leave empty (a
  # blank list, "[]") to show every area Home Assistant knows about --
  # good default for a first run so nothing needs configuring just to see
  # something on screen.
  areas: []

  # "portrait" or "landscape". This is one real advantage of custom
  # software over a browser-based kiosk: orientation is a pure rendering
  # decision, not tied to how the physical panel happens to be built.
  # The 10.1" Touch Display 2 this project is built around is native
  # portrait, but someone running this against a landscape-mounted panel
  # just sets this and the window dimensions swap automatically.
  orientation: "portrait"

  # Entity IDs to exclude from every area's light count/toggle. Real,
  # recurring need (see NATIVE_APP_SPEC.md "Other lessons from the PWA
  # build"): HA's Area registry pulls in non-fixture devices (network
  # switch status LEDs, etc.) and duplicate entities left behind by
  # integration re-adds -- both confirmed live in this instance's own
  # Master Bedroom area (2026-08-06). "unavailable" filtering alone
  # doesn't catch these since duplicates are often both fully live,
  # just pointing at the same physical device. Stopgap until there's a
  # real on-device picker (Admin Mode equivalent) -- same evolutionary
  # path config.js took in the PWA (hand-edited file first).
  excluded_entities: []

# Optional. Only needed if some of your real devices are only reachable
# through Homey (not bridged into HA, or bridged as read-only sensors).
# Leave the whole block out, or leave token blank, to skip this entirely.
# homey:
#   url: "http://your-homey-local-ip"
#   token: ""
#   device_ids: []
